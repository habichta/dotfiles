# Base settings
set -g prefix M-a
set-option -g history-limit 50000
setw -g window-status-current-format "#[reverse] #I:#W"

set -g default-terminal "tmux-256color"
set-option -a terminal-features 'xterm-256color:RGB'
set -g update-environment "DISPLAY:SSH_AGENT_PID:SSH_AUTH_SOCK:PATH"

set-option -g detach-on-destroy off
set -g mouse on
set -g focus-events on

# Forward OSC 52 from applications out to the Windows clipboard, so a yank in
# nvim can be pasted with Ctrl-V in Windows apps. tmux defaults to `external`,
# which sets the clipboard for tmux's own copies but drops the escape when an
# application inside a pane emits it -- verified: `on` reaches the Windows
# clipboard, `external` does not.
set -g set-clipboard on

# Key bindings
setw -g mode-keys vi
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind e setw synchronize-panes
unbind %

# NB: copy-mode-vi bindings live at the bottom of this file, after the tpm
# `run` line -- tmux-yank rebinds y and MouseDragEnd1Pane when it loads, so
# anything set up here would be silently overwritten.


# Windows / Panes
set -g base-index 1
setw -g pane-base-index 1

unbind '"'
bind "'" split-window -hc "#{pane_current_path}" # Split panes vertically
bind \\ split-window -vc "#{pane_current_path}" # Split panes horizontally

bind-key -n M-n next-window
bind-key -n M-m previous-window

unbind r
bind-key r command-prompt "rename-window %%"

bind-key 7 confirm-before -p "Kill window #W? (y/n)" kill-window

# Reset numbering when a window is closed
set -g renumber-windows on

# Hooks
set-hook -g pane-focus-in 'run-shell "cd #{pane_current_path} && update-tmux-window-name.sh"'

# Session/Window Fuzzy switcher
unbind-key w
bind-key w new-window -n "session-switcher" "tmux list-windows -a -F '#{session_name}:#{window_index} [#{window_name}]' | grep -v '\\[session-switcher\\]' | fzf --layout=reverse | cut -d' ' -f1 | xargs -I {} tmux switch-client -t {}"

unbind-key p
bind-key p switch-client -p

# send-keys shortcuts
unbind-key M-d
bind-key M-d send-keys "docker logs --tail 100 -f "

unbind-key M-e
bind-key M-e send-keys "docker exec -it "

unbind-key M-v
bind-key M-v send-keys "docker run --rm -it  -v  <vol>:/data --label cronjob=true alpine sh"

# Unbind and bind Alt+number to switch to the corresponding window in one line
# Unbind and bind Alt+number to switch to the corresponding window in one line
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9


# set active-inactive window styles
set -g window-style 'bg=colour235'
set -g window-active-style 'fg=default,bg=colour234'


######## COLORSCHEME: gruvbox dark (medium) Statusbar ########
set-option -g status "on"

# default statusbar color
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1

# default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1

# default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3

# active window title colors
set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1

# pane border
set-option -g pane-active-border-style fg=colour250 #fg2
set-option -g pane-border-style fg=colour237 #bg1

# message infos
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# pane number display
set-option -g display-panes-active-colour colour250 #fg2
set-option -g display-panes-colour colour237 #bg1

# clock
set-window-option -g clock-mode-colour colour109 #blue

# bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

## Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[bg=colour241,fg=colour248] #S #[bg=colour237,fg=colour241,nobold,noitalics,nounderscore]"
set-option -g status-right "#[fg=colour167] #{?client_prefix,● ● ● ● ● ● ● ●,         } #[bg=colour239,fg=colour239,nobold,nounderscore,noitalics]#[bg=colour239,fg=colour246]CPU: #(top -bn1 | grep 'Cpu(s)' | awk '{print $2 + $4\"%\"}') MEM: #(free -h | awk '/^Mem/ { print $3\"/\"$2 }')  %Y-%m-%d  %H:%M #[bg=colour239,fg=colour248,nobold,noitalics,nounderscore]#[bg=colour248,fg=colour237] #h "

set-window-option -g window-status-current-format "#[bg=colour214,fg=colour237,nobold,noitalics,nounderscore]#[bg=colour214,fg=colour239] #I #[bg=colour214,fg=colour239,bold] #W#{?window_zoomed_flag,*Z,} #[bg=colour237,fg=colour214,nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[bg=colour239,fg=colour237,noitalics]#[bg=colour239,fg=colour223] #I #[bg=colour239,fg=colour223] #W #[bg=colour237,fg=colour239,noitalics]"

################# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @tmux-gruvbox 'dark'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key T
# The default command is `tmux set-buffer -- {}`, which lands the hit in a tmux
# buffer only -- pasteable with prefix-] but invisible to Windows, which is why
# picking a hint appeared to do nothing. `-w` additionally pushes the buffer to
# the terminal clipboard over OSC 52 (works now that set-clipboard is on).
#
# @thumbs-osc52 1 is an equivalent route (the tmux-thumbs binary supports
# --osc52); this way is used because it is verified end to end. Note the plugin
# runs target/release/tmux-thumbs, not target/release/thumbs -- only the former
# takes --osc52, and tmux-thumbs.sh ends in `|| true`, so a bad flag would make
# thumbs silently do nothing rather than report an error.
set -g @thumbs-command 'tmux set-buffer -w -- {} && tmux display-message "Copied {}"'
# Hint anything inside square brackets; the capture group means only the
# contents get copied, not the brackets.
set -g @thumbs-regexp-1 '\[([^\]]*)\]'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

########################################
# copy-mode-vi -- MUST stay after tpm above, since tmux-yank rebinds y and
# MouseDragEnd1Pane on load and would otherwise win.
#
# Bare `copy-pipe-and-cancel` (no shell command) leaves the copy to tmux, which
# emits OSC 52 because set-clipboard is on. tmux-yank's default pipes through
# `cat | clip.exe` instead, spawning a Windows process per yank -- the same
# ~36ms cost that stalls under load. Verified the bare form reaches the Windows
# clipboard.
########################################
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# Releasing the mouse keeps the highlight and stays in copy-mode instead of
# auto-copying. `stop-selection` only stops the selection from extending --
# unlike copy-pipe-and-cancel (tmux-yank's default) it neither copies nor
# cancels, so nothing reaches the clipboard until you ask for it.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# Explicit copy. Routed through copycat's quit hook exactly as its own Enter
# binding is, so leaving a copycat search this way does not strand its counter.
bind-key -T copy-mode-vi C-c run-shell "tmux send-keys -X copy-pipe-and-cancel; ~/.tmux/plugins/tmux-copycat/scripts/copycat_mode_quit.sh; true"

# Poor man's text objects. tmux has no `i`/`a` operator, but a transient key
# table gives the two-keystroke feel: `i` switches into it, the next key picks
# the object. Only `w` is a true equivalent -- select-word is a real command.
bind-key -T copy-mode-vi i switch-client -T copy-mode-textobj
bind-key -T copy-mode-textobj w send -X select-word
# `[` approximates va[ : start a selection and run to the matching bracket.
# Requires the cursor to already sit ON the opening bracket (use f[ to get
# there), and unlike vim it includes the brackets themselves.
bind-key -T copy-mode-textobj [ send -X begin-selection \; send -X next-matching-bracket
bind-key -T copy-mode-textobj ( send -X begin-selection \; send -X next-matching-bracket
bind-key -T copy-mode-textobj Escape switch-client -T copy-mode-vi
